<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carbon Footprint Calculator - EcoStore</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/script.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="container header-flex">
        <div class="logo">
          <h1><i class="fas fa-leaf"></i> EcoStore</h1>
        </div>
        <button
          id="menu-toggle"
          class="menu-btn"
          aria-label="Toggle navigation"
        >
          <i class="fas fa-bars"></i>
        </button>
        <nav id="main-nav">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="calculator.html">Calculator</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="calculator">
        <div class="container">
          <h2>Carbon Footprint Calculator</h2>
          <p class="section-intro">
            Estimate the carbon footprint of your product usage.
          </p>

          <form id="footprint-form">
            <label for="product">Product Type:</label>
            <select id="product" required>
              <option value="">Select a product</option>
              <option value="toothbrush">Bamboo Toothbrush</option>
              <option value="bag">Reusable Shopping Bag</option>
              <option value="straws">Metal Straws</option>
              <option value="compost">Kitchen Compost Bin</option>
              <option value="beeswax">Beeswax Food Wraps</option>

              <option value="shampoo">Natural Shampoo Bar</option>
              <option value="notebook">Recycled Paper Notebook</option>
              <option value="bowl">Coconut Bowl Set</option>
            </select>

            <label for="frequency">Usage Frequency (times per week):</label>
            <input type="number" id="frequency" min="1" required />

            <label for="duration">Duration (in months):</label>
            <input type="number" id="duration" min="1" required />

            <button type="submit" class="btn">Calculate</button>
          </form>

          <div id="result" class="result-box"></div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>
          &copy; 2025 Eco-Friendly Product Store | Designed with 🌱 and care
        </p>
      </div>
    </footer>
  </body>
</html>
