<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - EcoStore</title>
    <link rel="stylesheet" href="css/style.css" />
    <script defer src="js/script.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style></style>
  </head>
  <body>
    <header>
      <div class="container header-flex">
        <div class="logo">
          <h1><i class="fas fa-leaf"></i> EcoStore</h1>
        </div>
        <button
          id="menu-toggle"
          class="menu-btn"
          aria-label="Toggle navigation"
        >
          <i class="fas fa-bars"></i>
        </button>
        <nav id="main-nav">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="calculator.html">Calculator</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="contact-section">
        <div class="container">
          <h2>Contact Customer Service</h2>
          <p class="section-intro">
            We're here to help. Fill out the form below and we'll get back to
            you as soon as possible.
          </p>

          <form id="contact-form">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required />

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required />

            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required />

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit" class="btn">Send Message</button>
          </form>
          <div id="form-status" class="status-message"></div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>&copy; 2025 EcoStore | Designed for a Greener Future</p>
      </div>
    </footer>
  </body>
</html>
